apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: {{ .Release.Namespace }}
data:
  MONGO_URI: {{ .Values.config.mongoUri | quote }}
  ORIGIN: {{ .Values.config.origin | quote }}
  LOGIN_TOKEN_EXPIRATION: {{ .Values.config.loginTokenExpiration | quote }}
  OTP_EXPIRATION_TIME: {{ .Values.config.otpExpirationTime | quote }}
  PASSWORD_RESET_TOKEN_EXPIRATION: {{ .Values.config.passwordResetTokenExpiration | quote }}
  COOKIE_EXPIRATION_DAYS: {{ .Values.config.cookieExpirationDays | quote }}
  PRODUCTION: {{ .Values.config.production | quote }}
